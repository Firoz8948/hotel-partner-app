<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <title>LalganjEats Restaurant Partner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ff0000">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body>
  <app-root>
    <div style="position: fixed; inset: 0; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
      <img src="assets/images/logo.svg" alt="Restaurant Partner Logo" style="width: 140px; max-width: 60vw; height: auto; margin-bottom: 24px; animation: pulse-logo 1.8s infinite ease-in-out;">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #111827; letter-spacing: -0.5px;">Restaurant Partner LalganjEats</h1>
      <p style="margin: 8px 0 0 0; font-size: 16px; font-weight: 700; color: #16a34a;">Aap Hamare Partner Hain</p>
      <style>
        @keyframes pulse-logo {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.05); opacity: 0.85; }
        }
      </style>
    </div>
  </app-root>
</body>
</html>
